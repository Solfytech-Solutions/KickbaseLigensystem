name: Daten aktualisieren & auf GitHub Pages deployen

on:
  # Montags um 20:00 deutscher Zeit.
  # GitHub-Cron läuft immer in UTC und kennt keine Sommerzeit, deshalb zwei
  # Einträge: 18:00 UTC = 20:00 in der Sommerzeit, 19:00 UTC = 20:00 in der
  # Winterzeit. Der Job "zeitfenster-pruefen" lässt nur den passenden durch.
  schedule:
    - cron: "0 18 * * 1"
    - cron: "0 19 * * 1"
  # Manuell auslösbar über den Actions-Tab (Button "Run workflow")
  workflow_dispatch:
  # Bei jeder Änderung am Code neu bauen und deployen
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deployments gleichzeitig, aber laufende auch nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Sorgt dafür, dass von den beiden Cron-Zeiten nur die durchkommt, die
  # gerade wirklich 20 Uhr deutscher Zeit ist. Manuelle Starts und Pushes
  # laufen immer durch.
  zeitfenster-pruefen:
    runs-on: ubuntu-latest
    outputs:
      ausfuehren: ${{ steps.pruefung.outputs.ausfuehren }}
    steps:
      - id: pruefung
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manueller Start oder Push – wird ausgeführt."
            echo "ausfuehren=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STUNDE=$(TZ=Europe/Berlin date +%H)
          if [ "$STUNDE" = "20" ]; then
            echo "Es ist $STUNDE Uhr in Berlin – wird ausgeführt."
            echo "ausfuehren=true" >> "$GITHUB_OUTPUT"
          else
            echo "Es ist $STUNDE Uhr in Berlin – dieser Lauf wird übersprungen."
            echo "ausfuehren=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: zeitfenster-pruefen
    if: needs.zeitfenster-pruefen.outputs.ausfuehren == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scripts/requirements.txt

      - name: Kickbase-Daten holen → public/data/leagues.json
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          # Optional: Kommagetrennte Liga-IDs (leer = alle Ligen des Accounts)
          KICKBASE_LEAGUE_IDS: ${{ secrets.KICKBASE_LEAGUE_IDS }}
        run: python scripts/fetch_data.py

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: public/ als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
