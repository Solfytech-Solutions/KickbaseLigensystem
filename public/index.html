<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SG Bega/Humfeld – Kickbase Ligen</title>
  <meta name="description" content="Die Tabellen beider Kickbase-Ligen der SG Bega/Humfeld auf einen Blick" />
  <meta name="theme-color" content="#ce111c" />
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-logo">
          <img src="logo.png" alt="Wappen TuS Bega 09 und TuS Humfeld" />
        </span>
        <span class="brand-text">
          <strong>SG Bega/Humfeld</strong>
          <small>Kickbase Ligen</small>
        </span>
      </div>
      <div class="last-updated" id="lastUpdated">Lade Daten …</div>
    </div>
  </header>

  <!-- ── Hauptinhalt ── -->
  <main class="main-content">
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Lade Tabellen …</p>
    </div>
    <div id="errorState" class="error-state hidden">
      <span class="error-icon">⚠️</span>
      <p id="errorMessage">Ein Fehler ist aufgetreten.</p>
    </div>

    <!-- Pro Liga eine Tabelle – dynamisch befüllt -->
    <div id="leaguesGrid" class="leagues-grid hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
