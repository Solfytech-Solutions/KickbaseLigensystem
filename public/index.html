<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bega/Humfeld Ligen Dashboard</title>
  <meta name="description" content="Die Tabellenstände aller Bega/Humfeld Kickbase-Ligen auf einen Blick" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚽</span>
        <span class="logo-text">Kickbase <strong>Bega/Humfeld</strong></span>
      </div>
      <div class="last-updated" id="lastUpdated">Lade Daten …</div>
    </div>
  </header>

  <!-- ── Hauptinhalt ── -->
  <main class="main-content">
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Lade Tabellen …</p>
    </div>
    <div id="errorState" class="error-state hidden">
      <span class="error-icon">⚠️</span>
      <p id="errorMessage">Ein Fehler ist aufgetreten.</p>
    </div>

    <!-- Pro Liga eine Tabelle – dynamisch befüllt -->
    <div id="leaguesGrid" class="leagues-grid hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
