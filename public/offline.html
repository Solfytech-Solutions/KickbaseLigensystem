<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungsarbeiten | Kickbase Ligen</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .maintenance-container {
            max-width: 600px;
            padding: 40px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            backdrop-filter: blur(var(--blur));
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .icon-box {
            font-size: 4rem;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 20px var(--accent-glow));
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 99px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: blink 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon-box">⚡</div>
        <div class="status-badge">
            <span class="status-dot"></span>
            Vorübergehend Offline
        </div>
        <h1>Wartungspause</h1>
        <p>
            Wir optimieren gerade das System für die nächsten Spieltage. 
            Die Seite wird in Kürze wieder verfügbar sein. 
            Vielen Dank für deine Geduld!
        </p>
        <div class="logo-text" style="font-size: 1rem; opacity: 0.6;">
            <strong>Kickbase</strong> Ligen
        </div>
    </div>
</body>
</html>
